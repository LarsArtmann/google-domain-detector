# Census resolver — TCP-only forwarding variant.
#
# Canonical UDP config: scripts/unbound.conf (same server settings except
# port/do-udp/do-tcp). This variant exists because of two measured defects
# of the UDP path:
#
# 1. NXDOMAIN fabrication under census load (2026-11-10 pilot and
#    2026-11-13 patch cleanup round 4): domains with live A records got
#    NXDOMAIN-classified verdicts through the UDP forwarder while the same
#    forwarder answered them correctly in isolation. Worker-count
#    independent (seen at w8 and at w2).
# 2. Host-level outbound UDP:53 outage (2026-11-12 23:24): every fresh
#    UDP recursion died while TCP:53 kept working; a wave launched into
#    that window burned ~3,450 garbage observations.
#
# Smoking gun in the unbound log for (1): "cannot increase max open fds
# from 65536 to 131566 — continuing with less udp ports: 4065" (the
# 8192 outgoing-range wants more fds than the user-scoped ulimit allows).
# UDP source-port pressure is the suspected misdelivery mechanism; TCP
# has no such matching surface (connection-scoped responses).
#
# Usage (per-instance lifecycle, never bare nohup):
#   GDD_UNBOUND_CONF=scripts/unbound-tcp.conf scripts/unbound.sh start
# The scanner then targets it with --resolver 127.0.0.1:5354.
#
# do-udp:no/do-tcp:yes make the CLIENT-facing transport TCP-only;
# tcp-upstream:yes is what forces the UPSTREAM (unbound → forwarder)
# transport to TCP as well — without it unbound would still relay over
# UDP and the suspected UDP misdelivery surface would remain. TCP
# buffers are raised above the 10/thread default so ~150 qps census
# load is not connection-bound.

server:
    interface: 127.0.0.1
    port: 5354
    do-ip4: yes
    do-ip6: no
    do-udp: no
    do-tcp: yes
    tcp-upstream: yes
    incoming-num-tcp: 150
    outgoing-num-tcp: 150
    verbosity: 1
    username: ""
    chroot: ""
    directory: ""
    pidfile: ""
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-max-ttl: 86400
    num-threads: 16
    outgoing-range: 8192
    so-reuseport: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    prefetch: yes
forward-zone:
    name: "."
    forward-addr: 9.9.9.9
    forward-addr: 149.112.112.112
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
remote-control:
    control-enable: no
