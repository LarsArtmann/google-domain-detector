# Census resolver — user-scoped caching forwarder for bulk scans.
#
# Canonical config (tracked). Runtime artifacts (log, pid) land in
# reports/census/unbound/ (gitignored).
#
# Design (E9, 2026-11-10): full recursion from this host collapsed under
# scan bursts — cold recursions took 10–20s+ at workers 4 (24% unknown on
# a mixed-TLD slice; every victim resolved instantly in isolation), which
# matches upstream-flow pressure on the local NAT path, not resolver CPU.
# Forwarding moves recursion onto infrastructure built for it, and
# unbound's cache absorbs repeat lookups. Sustained-load update (soak 1,
# 2026-11-10 20:22): 30 min at w8/10s through Quad9-only forwarding
# degraded to 26% unknown (timeouts oscillating 12–45% from minute 3
# onward; the short-window E9 ladder measured 1.5%). Real census qps at
# w8 is ~140–170 (5–7 lookups/domain at ~3.5 dom/s), not the 10–30 the
# E9 design assumed. Remedy: spread the load over two independent
# upstreams (Quad9 + Cloudflare). Measured numbers in
# reports/census/unbound/NOTES.md. Full-recursion mode (16 threads,
# outgoing-range 8192) remains valid where no trusted public resolver
# exists — see NOTES.md for that config.
server:
    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    verbosity: 1
    username: ""
    chroot: ""
    directory: ""
    pidfile: ""
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-max-ttl: 86400
    num-threads: 16
    outgoing-range: 8192
    so-reuseport: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    prefetch: yes
forward-zone:
    name: "."
    forward-addr: 9.9.9.9
    forward-addr: 149.112.112.112
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
remote-control:
    control-enable: no
