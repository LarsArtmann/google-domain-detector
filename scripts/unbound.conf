# Census resolver — user-scoped recursive unbound for bulk scans.
#
# Canonical config (tracked). Runtime artifacts (log, pid) land in
# reports/census/unbound/ (gitignored). Tuned 2026-11-10 after the E7
# worker-pressure measurements: 4 threads choked at scan workers 8
# (38 timeouts/200 domains, 3 081 SERVFAIL on the full 3 645-domain run);
# 16 threads + a wider outgoing range removed the bottleneck.
server:
    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    verbosity: 1
    username: ""
    chroot: ""
    directory: ""
    pidfile: ""
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-max-ttl: 86400
    num-threads: 16
    outgoing-range: 8192
    so-reuseport: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    prefetch: yes
remote-control:
    control-enable: no
